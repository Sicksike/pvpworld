
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PvPWorld | Game Selector</title>

<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
<link rel="icon" href="https://user54606.na.imgto.link/public/20261111/9f4dc652ec67205b06cb67bd-pvp-world-logo.avif">

<style>
:root {
    --background: #101722;
    --card: #192536;
    --border: #293548;
    --purple: #a18bea;
    --text: #f0f2f5;
    --muted: #aab5c5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
    font-family: 'Minecraftia', sans-serif;
    overflow-x: hidden;
}

/* TOP NAVIGATION */

.navbar {
    width: 100%;
    min-height: 76px;
    padding: 12px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #141e2c;
    border-bottom: 1px solid var(--border);
}

.nav-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
    text-decoration: none;
    font-size: 18px;
}

.nav-brand img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 11px;
    transition: color 0.2s;
}

.nav-links a:hover {
    color: var(--purple);
}

.nav-links .active {
    color: var(--purple);
}

/* SERVER STATUS */

.status-bar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 15px 10px;
    background: #141e2c;
    border-bottom: 1px solid var(--border);
}

.status-content {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 22px;
    font-size: 10px;
    color: var(--muted);
}

.status-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #e05252;
}

.status-dot.online {
    background: #45d483;
    box-shadow: 0 0 9px #45d483;
}

/* PAGE */

.page {
    width: 100%;
    min-height: calc(100vh - 130px);
    padding: 30px 15px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    margin: 12px 0 8px;
    text-align: center;
    font-size: clamp(22px, 4vw, 34px);
    letter-spacing: 2px;
}

.subtitle {
    margin: 0;
    color: var(--muted);
    text-align: center;
    font-size: 11px;
}

.instruction {
    margin: 22px 0 5px;
    color: var(--purple);
    text-align: center;
    font-size: 10px;
}

/* WHEEL AREA */

.wheel-area {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    min-height: 650px;
    position: relative;
    margin-top: 5px;
}

.wheel-container {
    width: min(96vw, 90vh, 1000px);
    height: min(96vw, 90vh, 1000px);
    max-width: 1000px;
    max-height: 1000px;
    position: relative;
    display: none;
    align-items: center;
    justify-content: center;
    animation: wheelAppear 0.7s ease forwards;
}

.wheel-container.show {
    display: flex;
}

@keyframes wheelAppear {
    from {
        opacity: 0;
        transform: scale(0.75);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* OUTER RING */

.wheel-ring {
    position: absolute;
    width: 96%;
    height: 96%;
    border: 1px solid rgba(161, 139, 234, 0.15);
    border-radius: 50%;
    pointer-events: none;
}

/* ROTATING WHEEL */

.wheel-rotator {
    width: 100%;
    height: 100%;
    position: absolute;
    border-radius: 50%;
    animation: slowSpin 45s linear infinite;
}

@keyframes slowSpin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* MODE ICONS */

.mode-item {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 110px;
    height: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    cursor: pointer;
}

.mode-content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    animation: counterSpin 45s linear infinite;
    transition: filter 0.2s;
}

@keyframes counterSpin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(-360deg);
    }
}

/* No icon backgrounds, cards, or borders */

.mode-item img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    filter: none;
    transition: transform 0.25s ease, filter 0.25s ease;
}

.mode-item:hover {
    z-index: 20;
}

.mode-item:hover img {
    transform: scale(1.3);
    filter: drop-shadow(0 0 14px rgba(161, 139, 234, 0.85));
}

.mode-name {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 2px;
    color: white;
    font-size: 9px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 2px 8px black;
    transition: opacity 0.2s;
}

.mode-item:hover .mode-name {
    opacity: 1;
}

/* START BUTTON */

.start-button {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 2px solid var(--purple);
    background: #192536;
    color: white;
    font-family: 'Minecraftia', sans-serif;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 35px rgba(161, 139, 234, 0.18);
    transition: 0.25s;
}

.start-button:hover {
    transform: scale(1.08);
    background: #222f43;
    box-shadow: 0 0 45px rgba(161, 139, 234, 0.4);
}

.start-button.pop {
    animation: popOut 0.35s ease forwards;
}

@keyframes popOut {
    0% {
        transform: scale(1);
        opacity: 1;
    }
    50% {
        transform: scale(1.25);
        opacity: 0.7;
    }
    100% {
        transform: scale(0);
        opacity: 0;
    }
}

/* FOOTER */

.footer {
    padding: 20px;
    text-align: center;
    color: #657286;
    font-size: 9px;
}

/* MOBILE */

@media (max-width: 600px) {
    .navbar {
        padding: 12px 4%;
    }

    .nav-brand {
        font-size: 13px;
    }

    .nav-brand img {
        width: 34px;
        height: 34px;
    }

    .nav-links {
        gap: 12px;
    }

    .nav-links a {
        font-size: 9px;
    }

    .status-content {
        gap: 12px;
        font-size: 9px;
    }

    .page {
        padding-top: 25px;
    }

    .wheel-area {
        min-height: 470px;
    }

    .wheel-container {
        width: 96vw;
        height: 96vw;
    }

    .wheel-ring {
        width: 97%;
        height: 97%;
    }

    .mode-item {
        width: 75px;
        height: 95px;
    }

    .mode-item img {
        width: 65px;
        height: 65px;
    }

    .mode-name {
        font-size: 7px;
    }

    .start-button {
        width: 145px;
        height: 145px;
        font-size: 14px;
    }
}

@media (max-width: 380px) {
    .nav-links {
        gap: 8px;
    }

    .nav-links a {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<!-- TOP NAVIGATION -->

<nav class="navbar">
    <a href="index.html" class="nav-brand">
        <img src="https://user54606.na.imgto.link/public/20261111/9f4dc652ec67205b06cb67bd-pvp-world-logo.avif" alt="PvPWorld Logo">
        <span>PvPWorld</span>
    </a>

    <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="game.html" class="active">GAME</a>
        <a href="https://discord.gg/eQzZXcjs6" target="_blank" rel="noopener noreferrer">DISCORD</a>
    </div>
</nav>

<!-- CENTERED SERVER STATUS -->

<div class="status-bar">
    <div class="status-content">
        <div class="status-item">
            <span class="status-dot" id="status-dot"></span>
            <span id="server-status">Checking Server...</span>
        </div>

        <div class="status-item">
            <span id="player-count">Players: --</span>
        </div>
    </div>
</div>

<main class="page">

    <h1>GAME SELECTOR</h1>
    <p class="subtitle">Find your next challenge.</p>

    <p class="instruction">
        Select 1 mode at a time to find your favorite mode.
    </p>

    <div class="wheel-area">

        <button class="start-button" id="start-button" onclick="startGame()">
            START<br>GAME
        </button>

        <div class="wheel-container" id="wheel-container">
            <div class="wheel-ring"></div>
            <div class="wheel-rotator" id="wheel-rotator"></div>
        </div>

    </div>

</main>

<div class="footer">
    PvPWorld © 2026
</div>

<script>

/* SERVER STATUS */

async function updateServerStatus() {
    const status = document.getElementById("server-status");
    const players = document.getElementById("player-count");
    const dot = document.getElementById("status-dot");

    try {
        const response = await fetch(
            "https://api.mcsrvstat.us/3/play2.eternalzero.cloud:26419"
        );

        const data = await response.json();

        if (data.online) {
            status.textContent = "Server Online";
            dot.classList.add("online");

            const online = data.players?.online ?? 0;
            const max = data.players?.max ?? "?";

            players.textContent = `Players: ${online}/${max}`;
        } else {
            status.textContent = "Server Offline";
            players.textContent = "Players: 0";
            dot.classList.remove("online");
        }
    } catch (error) {
        status.textContent = "Status Unavailable";
        players.textContent = "Players: --";
        dot.classList.remove("online");
    }
}

updateServerStatus();
setInterval(updateServerStatus, 300000);


/* GAME MODES */

const gameModes = [
    {
        name: "Spear Mace",
        image: "https://media.forgecdn.net/avatars/thumbnails/1678/399/256/256/639066907617132686.png"
    },
    {
        name: "Mace",
        image: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/63/Mace.png/revision/latest?cb=20260330015956"
    },
    {
        name: "UHC",
        image: "https://static.wikia.nocookie.net/pvplegacy/images/c/c9/UHCDuels.png/revision/latest/thumbnail/width/360/height/360?cb=20230408002546"
    },
    {
        name: "Sword",
        image: "https://minecraft.wiki/images/Enchanted_Diamond_Sword.gif?f741f"
    },
    {
        name: "Axe",
        image: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/40/Diamond_Axe_JE3_BE3.png/revision/latest/scale-to-width/360?cb=20200226193844"
    },
    {
        name: "Crystal",
        image: "https://static.wikia.nocookie.net/minecraft/images/9/92/EndCrystalNew.png/revision/latest?cb=20191218004335"
    },
    {
        name: "Pot",
        image: "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2.png?d45f1"
    },
    {
        name: "Nethpot",
        image: "https://i.pinimg.com/564x/10/0d/d5/100dd5bae19708177959763d81907ab9.jpg"
    },
    {
        name: "Cart",
        image: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/72/Minecart_with_TNT_%28item%29_JE1_BE1.png/revision/latest?cb=20190910054555"
    },
    {
        name: "HT3 Cart",
        image: "https://minecraft.wiki/images/Crossbow.png?0da8f"
    },
    {
        name: "SMP",
        image: "https://minecraft.wiki/images/Shield_JE2_BE1.png?4837d"
    },
    {
        name: "Diamond SMP",
        image: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/a/ab/Diamond_JE3_BE3.png/revision/latest/thumbnail/width/360/height/360?cb=20230924193138"
    },
    {
        name: "Explosive Diarrhea",
        image: "https://minecraft.wiki/images/Brown_Dye_JE2_BE2.png?85e10"
    }
];


/* CREATE WHEEL */

function createWheel() {
    const wheel = document.getElementById("wheel-rotator");

    wheel.innerHTML = "";

    const shuffled = [...gameModes].sort(() => Math.random() - 0.5);
    const selectedModes = shuffled.slice(0, 7);

    const wheelSize = wheel.parentElement.getBoundingClientRect().width;

    // Push icons almost all the way to the outside edge.
    const radius = wheelSize * 0.425;

    selectedModes.forEach((mode, index) => {
        const angle = (index / selectedModes.length) * Math.PI * 2 - Math.PI / 2;

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        const item = document.createElement("div");
        item.className = "mode-item";

        item.style.left = `calc(50% + ${x}px)`;
        item.style.top = `calc(50% + ${y}px)`;

        const content = document.createElement("div");
        content.className = "mode-content";

        const image = document.createElement("img");
        image.src = mode.image;
        image.alt = mode.name;
        image.draggable = false;

        const name = document.createElement("div");
        name.className = "mode-name";
        name.textContent = mode.name;

        content.appendChild(image);
        content.appendChild(name);
        item.appendChild(content);
        wheel.appendChild(item);
    });
}


/* START GAME */

function startGame() {
    const button = document.getElementById("start-button");
    const wheel = document.getElementById("wheel-container");

    button.classList.add("pop");

    setTimeout(() => {
        button.style.display = "none";

        wheel.classList.add("show");

        createWheel();
    }, 350);
}

</script>

</body>
</html>
