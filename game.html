
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PvPWorld | Game Selector</title>

<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

<style>
:root {
    --background: #101722;
    --card: #192536;
    --border: #293548;
    --purple: #a18bea;
    --text: #f0f2f5;
    --muted: #aab5c5;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
    font-family: 'Minecraftia', monospace;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

/* SERVER STATUS BAR */

.status-bar {
    background: #101722;
    border-bottom: 1px solid #293548;
    padding: 10px 0;
    text-align: center;
    font-size: 10px;
    color: #aab5c5;
}

.status-content {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    flex-wrap: wrap;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e6c66c;
    display: inline-block;
    box-shadow: 0 0 8px rgba(230, 198, 108, .5);
    flex-shrink: 0;
}

.status-dot.online {
    background: #55df91;
    box-shadow: 0 0 8px rgba(85, 223, 145, .6);
}

.status-dot.offline {
    background: #ff7070;
    box-shadow: 0 0 8px rgba(255, 112, 112, .5);
}

#server-status {
    color: #e6c66c;
}

#server-status.online {
    color: #55df91;
}

#server-status.offline {
    color: #ff7070;
}

#player-count {
    color: #aab5c5;
}

/* NAVIGATION */

header {
    background: #151f2d;
    border-bottom: 1px solid #293548;
    padding: 20px 0;
}

.wrap {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #b9a4ff;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 24px;
    flex-wrap: wrap;
}

nav a {
    color: var(--muted);
    transition: color .2s ease;
}

nav a:hover,
nav a.active {
    color: #b9a4ff;
}

/* PAGE */

.page {
    width: 100%;
    min-height: calc(100vh - 150px);
    padding: 30px 15px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    margin: 12px 0 8px;
    text-align: center;
    font-size: clamp(22px, 4vw, 34px);
    letter-spacing: 2px;
}

.subtitle {
    margin: 0;
    color: var(--muted);
    text-align: center;
    font-size: 11px;
}

.instruction {
    margin: 22px 0 5px;
    color: var(--purple);
    text-align: center;
    font-size: 10px;
}

/* WHEEL AREA */

.wheel-area {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    min-height: 650px;
    position: relative;
    margin-top: 5px;
}

.wheel-container {
    width: min(96vw, 90vh, 1000px);
    height: min(96vw, 90vh, 1000px);
    max-width: 1000px;
    max-height: 1000px;
    position: relative;
    display: none;
    align-items: center;
    justify-content: center;
    animation: wheelAppear 0.7s ease forwards;
}

.wheel-container.show {
    display: flex;
}

@keyframes wheelAppear {
    from {
        opacity: 0;
        transform: scale(0.75);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* OUTER RING */

.wheel-ring {
    position: absolute;
    width: 96%;
    height: 96%;
    border: 1px solid rgba(161, 139, 234, 0.15);
    border-radius: 50%;
    pointer-events: none;
}

/* ROTATING WHEEL */

.wheel-rotator {
    width: 100%;
    height: 100%;
    position: absolute;
    border-radius: 50%;
    animation: slowSpin 45s linear infinite;
}

@keyframes slowSpin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* MODE ICONS */

.mode-item {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 110px;
    height: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: opacity .35s ease;
}

.mode-content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    animation: counterSpin 45s linear infinite;
    transition: filter 0.2s;
}

@keyframes counterSpin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(-360deg);
    }
}

/* TEXTURES */

.mode-item img {
    width: 90px;
    height: 90px;
    object-fit: contain;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    image-rendering: pixelated;
    filter: none;
    transition: transform 0.25s ease, filter 0.25s ease;
}

.mode-item:hover {
    z-index: 20;
}

.mode-item:hover img {
    transform: scale(1.3);
    filter: drop-shadow(0 0 14px rgba(161, 139, 234, 0.85));
}

.mode-name {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 2px;
    color: white;
    font-size: 9px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 2px 8px black;
    transition: opacity 0.2s;
}

.mode-item:hover .mode-name {
    opacity: 1;
}

/* POP ANIMATION */

.mode-item.popping {
    animation: modePop .4s ease forwards;
    pointer-events: none;
}

@keyframes modePop {
    0% {
        opacity: 1;
        scale: 1;
    }

    50% {
        opacity: .7;
        scale: 1.3;
    }

    100% {
        opacity: 0;
        scale: 0;
    }
}

/* START BUTTON */

.start-button {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 2px solid var(--purple);
    background: #192536;
    color: white;
    font-family: 'Minecraftia', sans-serif;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 35px rgba(161, 139, 234, 0.18);
    transition: 0.25s;
}

.start-button:hover {
    transform: scale(1.08);
    background: #222f43;
    box-shadow: 0 0 45px rgba(161, 139, 234, 0.4);
}

.start-button.pop {
    animation: popOut 0.35s ease forwards;
}

@keyframes popOut {
    0% {
        transform: scale(1);
        opacity: 1;
    }

    50% {
        transform: scale(1.25);
        opacity: 0.7;
    }

    100% {
        transform: scale(0);
        opacity: 0;
    }
}

/* SELECTED GAME MODES */

.results-container {
    display: none;
    width: 100%;
    max-width: 950px;
    align-items: center;
    justify-content: center;
    gap: 35px;
    margin: auto;
}

.results-container.show {
    display: flex;
    animation: resultsAppear .65s ease forwards;
}

@keyframes resultsAppear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.result-mode {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px 10px;
    border: 1px solid rgba(161, 139, 234, .2);
    border-radius: 12px;
    background: rgba(25, 37, 54, .75);
    transition: .25s ease;
}

.result-mode img {
    width: 110px;
    height: 110px;
    object-fit: contain;
    image-rendering: pixelated;
    transition: transform .25s ease;
}

.result-mode:hover img {
    transform: scale(1.12);
}

.result-mode h2 {
    margin-top: 18px;
    font-size: 12px;
    color: white;
    font-weight: normal;
}

.result-mode p {
    margin-top: 8px;
    font-size: 8px;
    color: var(--muted);
}

/* SELECTED MODE */

.result-mode.selected {
    flex: 1.25;
    border: 2px solid var(--purple);
    box-shadow: 0 0 35px rgba(161, 139, 234, .22);
    transform: scale(1.08);
}

.result-mode.selected img {
    width: 150px;
    height: 150px;
}

.result-mode.selected h2 {
    color: var(--purple);
    font-size: 14px;
}

.selected-label {
    color: var(--purple);
    font-size: 9px;
    margin-bottom: 12px;
}

/* RESET BUTTON */

.reset-button {
    display: none;
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    padding: 13px 22px;
    background: #192536;
    color: var(--purple);
    border: 1px solid var(--purple);
    border-radius: 6px;
    font-family: 'Minecraftia', sans-serif;
    font-size: 10px;
    cursor: pointer;
    transition: 0.2s;
    z-index: 30;
}

.reset-button:hover {
    background: #26344a;
    box-shadow: 0 0 18px rgba(161, 139, 234, 0.2);
}

.reset-button.show {
    display: block;
}

/* FOOTER */

.footer {
    padding: 20px;
    text-align: center;
    color: #657286;
    font-size: 9px;
}

/* MOBILE */

@media (max-width: 700px) {
    nav {
        flex-direction: column;
    }

    nav ul {
        justify-content: center;
        gap: 14px;
    }
}

@media (max-width: 600px) {
    .status-content {
        gap: 9px;
        font-size: 9px;
    }

    .page {
        padding-top: 25px;
    }

    .wheel-area {
        min-height: 470px;
    }

    .wheel-container {
        width: 96vw;
        height: 96vw;
    }

    .wheel-ring {
        width: 97%;
        height: 97%;
    }

    .mode-item {
        width: 75px;
        height: 95px;
    }

    .mode-item img {
        width: 65px;
        height: 65px;
    }

    .mode-name {
        font-size: 7px;
    }

    .start-button {
        width: 145px;
        height: 145px;
        font-size: 14px;
    }

    .reset-button {
        bottom: -8px;
        font-size: 9px;
    }

    .results-container {
        gap: 8px;
    }

    .result-mode {
        padding: 15px 5px;
    }

    .result-mode img {
        width: 65px;
        height: 65px;
    }

    .result-mode h2 {
        font-size: 8px;
    }

    .result-mode p {
        font-size: 6px;
    }

    .result-mode.selected img {
        width: 85px;
        height: 85px;
    }

    .result-mode.selected h2 {
        font-size: 9px;
    }

    .selected-label {
        font-size: 7px;
    }
}

@media (max-width: 450px) {
    h1 {
        font-size: 21px;
    }

    nav ul {
        gap: 12px;
    }

    nav a {
        font-size: 9px;
    }
}

@media (max-width: 380px) {
    nav ul {
        gap: 9px;
    }

    nav a {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<!-- SERVER STATUS BAR -->

<div class="status-bar">
    <div class="status-content">
        <span id="server-status-dot" class="status-dot"></span>
        <span>SERVER STATUS:</span>
        <span id="server-status">CHECKING...</span>
        <span id="player-count"></span>
    </div>
</div>

<!-- NAVIGATION -->

<header>
    <div class="wrap">
        <nav>
            <div class="logo">PvPWorld</div>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="game.html" class="active">Game</a></li>
                <li><a href="https://discord.gg/eQzZXcjs6" target="_blank" rel="noopener noreferrer">Discord</a></li>
            </ul>
        </nav>
    </div>
</header>

<!-- GAME SELECTOR -->

<main class="page">

    <h1>GAME SELECTOR</h1>
    <p class="subtitle">Find your next challenge.</p>

    <p class="instruction">
        Select 1 mode at a time to find your favorite mode.
    </p>

    <div class="wheel-area">

        <button class="start-button" id="start-button" onclick="startGame()">
            START<br>GAME
        </button>

        <div class="wheel-container" id="wheel-container">
            <div class="wheel-ring"></div>
            <div class="wheel-rotator" id="wheel-rotator"></div>
        </div>

        <div class="results-container" id="results-container">
            <div class="result-mode selected" id="result-selected">
                <span class="selected-label">YOUR SELECTION</span>
                <img id="selected-image" src="" alt="">
                <h2 id="selected-name"></h2>
                <p>Selected mode</p>
            </div>

            <div class="result-mode" id="result-middle">
                <img id="middle-image" src="" alt="">
                <h2 id="middle-name"></h2>
                <p>Random mode</p>
            </div>

            <div class="result-mode" id="result-right">
                <img id="right-image" src="" alt="">
                <h2 id="right-name"></h2>
                <p>Random mode</p>
            </div>
        </div>

        <button class="reset-button" id="reset-button" onclick="resetGame()">
            RESET MODES
        </button>

    </div>

</main>

<footer class="footer">
    PvPWorld © 2026
</footer>

<script>

/* SERVER STATUS */

async function updateServerStatus() {
    const status = document.getElementById("server-status");
    const players = document.getElementById("player-count");
    const dot = document.getElementById("server-status-dot");

    try {
        const response = await fetch(
            "https://api.mcsrvstat.us/3/play2.eternalzero.cloud:26419"
        );

        if (!response.ok) {
            throw new Error("Status API unavailable");
        }

        const data = await response.json();

        if (data.online === true) {
            status.textContent = "ONLINE";
            status.className = "online";
            dot.className = "status-dot online";

            const online = data.players?.online ?? 0;
            const max = data.players?.max ?? "?";

            players.textContent = "• " + online + "/" + max + " PLAYERS ONLINE";

        } else {
            status.textContent = "OFFLINE";
            status.className = "offline";
            dot.className = "status-dot offline";
            players.textContent = "";
        }

    } catch (error) {
        status.textContent = "STATUS UNAVAILABLE";
        status.className = "";
        dot.className = "status-dot";
        players.textContent = "";
    }
}

updateServerStatus();
setInterval(updateServerStatus, 300000);


/* MINECRAFT TEXTURE BASE URL */

const textureBase =
    "https://mcasset.cloud/1.21.11/assets/minecraft/textures/item/";


/* GAME MODES */

const gameModes = [
    {
        name: "Spear Mace",
        image: "https://media.forgecdn.net/avatars/thumbnails/1678/399/256/256/639066907617132686.png"
    },
    {
        name: "Mace",
        image: "https://minecraft.wiki/images/Enchanted_Mace.gif?7c432"
    },
    {
        name: "UHC",
        image: "https://user54606.na.imgto.link/public/20261112/d64658ca17c25ad0a8b3cd68-image.avif"
    },
    {
        name: "Sword",
        image: "https://minecraft.wiki/images/Enchanted_Diamond_Sword.gif?f741f"
    },
    {
        name: "Axe",
        image: "https://user54606.na.imgto.link/public/20261112/ad2b2547cdbebc781fcb8ca1-image.avif"
    },
    {
        name: "Crystal",
        image: "https://user54606.na.imgto.link/public/20261112/82cf8fc49d2809038a3bc578-image.avif"
    },
    {
        name: "Pot",
        image: "https://user54606.na.imgto.link/public/20261112/1b5fc7ca69d09ddf7357fa5f-image.avif"
    },
    {
        name: "Nethpot",
        image: "https://minecraft.wiki/images/thumb/Enchanted_Netherite_Helmet_%28item%29.gif/120px-Enchanted_Netherite_Helmet_%28item%29.gif?0fb88"
    },
    {
        name: "Cart",
        image: "https://user54606.na.imgto.link/public/20261112/2e67c8091bfd6d78045a8504-image.avif"
    },
    {
        name: "HT3 Cart",
        image: "https://user54606.na.imgto.link/public/20261112/32c6420988ac5e64202a539e-image.avif"
    },
    {
        name: "SMP",
        image: "https://user54606.na.imgto.link/public/20261112/070c68f304f28a15e71f0458-image.avif"
    },
    {
        name: "Diamond SMP",
        image: "https://user54606.na.imgto.link/public/20261112/545efb1c38f8a9f0715e12ef-image.avif"
    },
    {
        name: "Explosive Diarrhea",
        image: "https://user54606.na.imgto.link/public/20261112/b03b5ad7daf79bc1a6aa7d67-image.avif"
    }
];


/* RANDOM NUMBER GENERATOR */

function randomIndex(max) {
    if (window.crypto && window.crypto.getRandomValues) {
        const randomValues = new Uint32Array(1);
        window.crypto.getRandomValues(randomValues);
        return randomValues[0] % max;
    }

    return Math.floor(Math.random() * max);
}


/* FISHER-YATES SHUFFLE */

function shuffleArray(array) {
    const shuffled = [...array];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = randomIndex(i + 1);

        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    return shuffled;
}


/* REMEMBER PREVIOUS SELECTION */

let previousSelection = [];


/* GET A NEW SET OF SEVEN */

function getRandomModes() {
    let selectedModes = [];

    for (let attempt = 0; attempt < 20; attempt++) {
        selectedModes = shuffleArray(gameModes).slice(0, 7);

        const currentNames = selectedModes
            .map(mode => mode.name)
            .sort()
            .join("|");

        const previousNames = [...previousSelection]
            .sort()
            .join("|");

        if (currentNames !== previousNames) {
            break;
        }
    }

    previousSelection = selectedModes.map(mode => mode.name);

    return selectedModes;
}


/* CREATE WHEEL */

function createWheel() {
    const wheel = document.getElementById("wheel-rotator");

    wheel.innerHTML = "";

    const selectedModes = getRandomModes();

    const wheelSize = wheel.parentElement.getBoundingClientRect().width;
    const radius = wheelSize * 0.425;

    selectedModes.forEach((mode, index) => {
        const angle =
            (index / selectedModes.length) * Math.PI * 2 - Math.PI / 2;

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        const item = document.createElement("div");
        item.className = "mode-item";

        item.style.left = `calc(50% + ${x}px)`;
        item.style.top = `calc(50% + ${y}px)`;

        const content = document.createElement("div");
        content.className = "mode-content";

        const image = document.createElement("img");
        image.src = mode.image;
        image.alt = mode.name;
        image.draggable = false;

        image.onerror = function () {
            this.onerror = null;
            this.src = textureBase + "diamond.png";
        };

        const name = document.createElement("div");
        name.className = "mode-name";
        name.textContent = mode.name;

        content.appendChild(image);
        content.appendChild(name);
        item.appendChild(content);
        wheel.appendChild(item);

        // Clicking a gamemode selects it.
        item.addEventListener("click", () => selectMode(mode, item));
    });
}


/* SELECT A GAMEMODE */

let selectionInProgress = false;

function selectMode(selectedMode, clickedItem) {
    if (selectionInProgress) return;

    selectionInProgress = true;

    const wheel = document.getElementById("wheel-container");
    const rotator = document.getElementById("wheel-rotator");
    const results = document.getElementById("results-container");

    // Stop the wheel from spinning.
    rotator.style.animationPlayState = "paused";

    // Make all seven icons pop away.
    const allItems = document.querySelectorAll(".mode-item");

    allItems.forEach(item => {
        item.classList.add("popping");
    });

    // Pick two different random modes from the remaining pool.
    const remainingModes = shuffleArray(
        gameModes.filter(mode => mode.name !== selectedMode.name)
    );

    const middleMode = remainingModes[0];
    const rightMode = remainingModes[1];

    // Set up the three results.
    showResult("selected", selectedMode);
    showResult("middle", middleMode);
    showResult("right", rightMode);

    // Show the results after the pop animation.
    setTimeout(() => {
        wheel.classList.remove("show");
        results.classList.add("show");
    }, 450);
}


/* DISPLAY RESULT */

function showResult(position, mode) {
    const image = document.getElementById(position + "-image");
    const name = document.getElementById(position + "-name");

    image.src = mode.image;
    image.alt = mode.name;

    image.onerror = function () {
        this.onerror = null;
        this.src = textureBase + "diamond.png";
    };

    name.textContent = mode.name;
}


/* START GAME */

function startGame() {
    const button = document.getElementById("start-button");
    const wheel = document.getElementById("wheel-container");
    const resetButton = document.getElementById("reset-button");

    if (wheel.classList.contains("show")) return;

    button.classList.add("pop");

    setTimeout(() => {
        button.style.display = "none";

        wheel.classList.add("show");
        resetButton.classList.add("show");

        createWheel();
    }, 350);
}


/* RESET MODES */

function resetGame() {
    const button = document.getElementById("start-button");
    const wheel = document.getElementById("wheel-container");
    const rotator = document.getElementById("wheel-rotator");
    const results = document.getElementById("results-container");

    selectionInProgress = false;

    results.classList.remove("show");

    wheel.classList.remove("show");

    rotator.style.animation = "none";
    rotator.offsetHeight;
    rotator.style.animation = "";

    button.classList.remove("pop");
    button.style.display = "block";

    document.getElementById("reset-button").classList.remove("show");
}

</script>
