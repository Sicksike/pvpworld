
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PvPWorld | Game Selector</title>

<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
<link rel="icon" href="https://user54606.na.imgto.link/public/20261111/9f4dc652ec67205b06cb67bd-pvp-world-logo.avif">

<style>
:root {
    --background: #101722;
    --card: #192536;
    --border: #293548;
    --purple: #a18bea;
    --text: #f0f2f5;
    --muted: #aab5c5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
    font-family: 'Minecraftia', sans-serif;
    overflow-x: hidden;
}

/* TOP NAVIGATION */

.navbar {
    width: 100%;
    min-height: 76px;
    padding: 12px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #141e2c;
    border-bottom: 1px solid var(--border);
}

.nav-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
    text-decoration: none;
    font-size: 18px;
}

.nav-brand img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 11px;
    transition: color 0.2s;
}

.nav-links a:hover,
.nav-links .active {
    color: var(--purple);
}

/* SERVER STATUS */

.status-bar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 15px 10px;
    background: #141e2c;
    border-bottom: 1px solid var(--border);
}

.status-content {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 22px;
    font-size: 10px;
    color: var(--muted);
}

.status-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #e05252;
}

.status-dot.online {
    background: #45d483;
    box-shadow: 0 0 9px #45d483;
}

/* PAGE */

.page {
    width: 100%;
    min-height: calc(100vh - 130px);
    padding: 30px 15px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    margin: 12px 0 8px;
    text-align: center;
    font-size: clamp(22px, 4vw, 34px);
    letter-spacing: 2px;
}

.subtitle {
    margin: 0;
    color: var(--muted);
    text-align: center;
    font-size: 11px;
}

.instruction {
    margin: 22px 0 5px;
    color: var(--purple);
    text-align: center;
    font-size: 10px;
}

/* WHEEL AREA */

.wheel-area {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    min-height: 650px;
    position: relative;
    margin-top: 5px;
}

.wheel-container {
    width: min(96vw, 90vh, 1000px);
    height: min(96vw, 90vh, 1000px);
    max-width: 1000px;
    max-height: 1000px;
    position: relative;
    display: none;
    align-items: center;
    justify-content: center;
    animation: wheelAppear 0.7s ease forwards;
}

.wheel-container.show {
    display: flex;
}

@keyframes wheelAppear {
    from {
        opacity: 0;
        transform: scale(0.75);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* OUTER RING */

.wheel-ring {
    position: absolute;
    width: 96%;
    height: 96%;
    border: 1px solid rgba(161, 139, 234, 0.15);
    border-radius: 50%;
    pointer-events: none;
}

/* ROTATING WHEEL */

.wheel-rotator {
    width: 100%;
    height: 100%;
    position: absolute;
    border-radius: 50%;
    animation: slowSpin 45s linear infinite;
}

@keyframes slowSpin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* MODE ICONS */

.mode-item {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 110px;
    height: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    cursor: pointer;
}

.mode-content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    animation: counterSpin 45s linear infinite;
    transition: filter 0.2s;
}

@keyframes counterSpin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(-360deg);
    }
}

/* TRANSPARENT MINECRAFT TEXTURES */

.mode-item img {
    width: 90px;
    height: 90px;
    object-fit: contain;

    /* No backgrounds, borders, or image shadows */
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;

    image-rendering: pixelated;
    filter: none;
    transition: transform 0.25s ease, filter 0.25s ease;
}

.mode-item:hover {
    z-index: 20;
}

.mode-item:hover img {
    transform: scale(1.3);
    filter: drop-shadow(0 0 14px rgba(161, 139, 234, 0.85));
}

.mode-name {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 2px;
    color: white;
    font-size: 9px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 2px 8px black;
    transition: opacity 0.2s;
}

.mode-item:hover .mode-name {
    opacity: 1;
}

/* START BUTTON */

.start-button {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 2px solid var(--purple);
    background: #192536;
    color: white;
    font-family: 'Minecraftia', sans-serif;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 35px rgba(161, 139, 234, 0.18);
    transition: 0.25s;
}

.start-button:hover {
    transform: scale(1.08);
    background: #222f43;
    box-shadow: 0 0 45px rgba(161, 139, 234, 0.4);
}

.start-button.pop {
    animation: popOut 0.35s ease forwards;
}

@keyframes popOut {
    0% {
        transform: scale(1);
        opacity: 1;
    }
    50% {
        transform: scale(1.25);
        opacity: 0.7;
    }
    100% {
        transform: scale(0);
        opacity: 0;
    }
}

/* RESET BUTTON */

.reset-button {
    display: none;
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    padding: 13px 22px;
    background: #192536;
    color: var(--purple);
    border: 1px solid var(--purple);
    border-radius: 6px;
    font-family: 'Minecraftia', sans-serif;
    font-size: 10px;
    cursor: pointer;
    transition: 0.2s;
    z-index: 30;
}

.reset-button:hover {
    background: #26344a;
    box-shadow: 0 0 18px rgba(161, 139, 234, 0.2);
}

.reset-button.show {
    display: block;
}

/* FOOTER */

.footer {
    padding: 20px;
    text-align: center;
    color: #657286;
    font-size: 9px;
}

/* MOBILE */

@media (max-width: 600px) {
    .navbar {
        padding: 12px 4%;
    }

    .nav-brand {
        font-size: 13px;
    }

    .nav-brand img {
        width: 34px;
        height: 34px;
    }

    .nav-links {
        gap: 12px;
    }

    .nav-links a {
        font-size: 9px;
    }

    .status-content {
        gap: 12px;
        font-size: 9px;
    }

    .page {
        padding-top: 25px;
    }

    .wheel-area {
        min-height: 470px;
    }

    .wheel-container {
        width: 96vw;
        height: 96vw;
    }

    .wheel-ring {
        width: 97%;
        height: 97%;
    }

    .mode-item {
        width: 75px;
        height: 95px;
    }

    .mode-item img {
        width: 65px;
        height: 65px;
    }

    .mode-name {
        font-size: 7px;
    }

    .start-button {
        width: 145px;
        height: 145px;
        font-size: 14px;
    }

    .reset-button {
        bottom: -8px;
        font-size: 9px;
    }
}

@media (max-width: 380px) {
    .nav-links {
        gap: 8px;
    }

    .nav-links a {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<!-- TOP NAVIGATION -->

<nav class="navbar">
    <a href="index.html" class="nav-brand">
        <img
            src="https://user54606.na.imgto.link/public/20261111/9f4dc652ec67205b06cb67bd-pvp-world-logo.avif"
            alt="PvPWorld Logo"
        >
        <span>PvPWorld</span>
    </a>

    <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="game.html" class="active">GAME</a>
        <a href="https://discord.gg/eQzZXcjs6" target="_blank" rel="noopener noreferrer">DISCORD</a>
    </div>
</nav>

<!-- CENTERED SERVER STATUS -->

<div class="status-bar">
    <div class="status-content">
        <div class="status-item">
            <span class="status-dot" id="status-dot"></span>
            <span id="server-status">Checking Server...</span>
        </div>

        <div class="status-item">
            <span id="player-count">Players: --</span>
        </div>
    </div>
</div>

<main class="page">

    <h1>GAME SELECTOR</h1>
    <p class="subtitle">Find your next challenge.</p>

    <p class="instruction">
        Select 1 mode at a time to find your favorite mode.
    </p>

    <div class="wheel-area">

        <button class="start-button" id="start-button" onclick="startGame()">
            START<br>GAME
        </button>

        <div class="wheel-container" id="wheel-container">
            <div class="wheel-ring"></div>
            <div class="wheel-rotator" id="wheel-rotator"></div>
        </div>

        <button class="reset-button" id="reset-button" onclick="resetGame()">
            RESET MODES
        </button>

    </div>

</main>

<div class="footer">
    PvPWorld © 2026
</div>

<script>

/* SERVER STATUS */

async function updateServerStatus() {
    const status = document.getElementById("server-status");
    const players = document.getElementById("player-count");
    const dot = document.getElementById("status-dot");

    try {
        const response = await fetch(
            "https://api.mcsrvstat.us/3/play2.eternalzero.cloud:26419"
        );

        const data = await response.json();

        if (data.online) {
            status.textContent = "Server Online";
            dot.classList.add("online");

            const online = data.players?.online ?? 0;
            const max = data.players?.max ?? "?";

            players.textContent = `Players: ${online}/${max}`;
        } else {
            status.textContent = "Server Offline";
            players.textContent = "Players: 0";
            dot.classList.remove("online");
        }
    } catch (error) {
        status.textContent = "Status Unavailable";
        players.textContent = "Players: --";
        dot.classList.remove("online");
    }
}

updateServerStatus();
setInterval(updateServerStatus, 300000);


/* MINECRAFT TEXTURE BASE URL */

const textureBase =
    "https://mcasset.cloud/1.21.11/assets/minecraft/textures/item/";


/* GAME MODES */

const gameModes = [
    {
        name: "Spear Mace",
        image: textureBase + "diamond_spear.png"
    },
    {
        name: "Mace",
        image: textureBase + "mace.png"
    },
    {
        name: "UHC",
        image: textureBase + "golden_apple.png"
    },
    {
        name: "Sword",
        image: textureBase + "diamond_sword.png"
    },
    {
        name: "Axe",
        image: textureBase + "diamond_axe.png"
    },
    {
        name: "Crystal",
        image: textureBase + "end_crystal.png"
    },
    {
        name: "Pot",
        image: textureBase + "splash_potion.png"
    },
    {
        name: "Nethpot",
        image: textureBase + "lingering_potion.png"
    },
    {
        name: "Cart",
        image: textureBase + "minecart.png"
    },
    {
        name: "HT3 Cart",
        image: textureBase + "crossbow_standby.png"
    },
    {
        name: "SMP",
        image: textureBase + "shield.png"
    },
    {
        name: "Diamond SMP",
        image: textureBase + "diamond.png"
    },
    {
        name: "Explosive Diarrhea",
        image: textureBase + "brown_dye.png"
    }
];


/* RANDOM NUMBER GENERATOR */

function randomIndex(max) {
    if (window.crypto && window.crypto.getRandomValues) {
        const randomValues = new Uint32Array(1);
        window.crypto.getRandomValues(randomValues);
        return randomValues[0] % max;
    }

    return Math.floor(Math.random() * max);
}


/* PROPER FISHER-YATES SHUFFLE */

function shuffleArray(array) {
    const shuffled = [...array];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = randomIndex(i + 1);

        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    return shuffled;
}


/* REMEMBER PREVIOUS SELECTION */

let previousSelection = [];


/* GET A NEW SET OF SEVEN */

function getRandomModes() {
    let selectedModes = [];

    // Try to avoid getting the exact same seven modes after a reset.
    for (let attempt = 0; attempt < 20; attempt++) {
        selectedModes = shuffleArray(gameModes).slice(0, 7);

        const currentNames = selectedModes
            .map(mode => mode.name)
            .sort()
            .join("|");

        const previousNames = [...previousSelection]
            .sort()
            .join("|");

        if (currentNames !== previousNames) {
            break;
        }
    }

    previousSelection = selectedModes.map(mode => mode.name);

    return selectedModes;
}


/* CREATE WHEEL */

function createWheel() {
    const wheel = document.getElementById("wheel-rotator");

    wheel.innerHTML = "";

    const selectedModes = getRandomModes();

    const wheelSize = wheel.parentElement.getBoundingClientRect().width;

    // Keep the icons close to the outside edge.
    const radius = wheelSize * 0.425;

    selectedModes.forEach((mode, index) => {
        const angle =
            (index / selectedModes.length) * Math.PI * 2 - Math.PI / 2;

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        const item = document.createElement("div");
        item.className = "mode-item";

        item.style.left = `calc(50% + ${x}px)`;
        item.style.top = `calc(50% + ${y}px)`;

        const content = document.createElement("div");
        content.className = "mode-content";

        const image = document.createElement("img");
        image.src = mode.image;
        image.alt = mode.name;
        image.draggable = false;

        // Fallback if an image ever fails to load.
        image.onerror = function () {
            this.onerror = null;
            this.src = textureBase + "diamond.png";
        };

        const name = document.createElement("div");
        name.className = "mode-name";
        name.textContent = mode.name;

        content.appendChild(image);
        content.appendChild(name);
        item.appendChild(content);
        wheel.appendChild(item);
    });
}


/* START GAME */

function startGame() {
    const button = document.getElementById("start-button");
    const wheel = document.getElementById("wheel-container");
    const resetButton = document.getElementById("reset-button");

    button.classList.add("pop");

    setTimeout(() => {
        button.style.display = "none";

        wheel.classList.add("show");
        resetButton.classList.add("show");

        createWheel();
    }, 350);
}


/* RESET MODES */

function resetGame() {
    const wheel = document.getElementById("wheel-container");
    const rotator = document.getElementById("wheel-rotator");

    // Restart the wheel animation.
    rotator.style.animation = "none";
    rotator.offsetHeight;
    rotator.style.animation = "";

    createWheel();
}

</script>

</body>
</html>
